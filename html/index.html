<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deej Config Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
              background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .container { max-width: 600px; margin: 0 auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #0f3460; }
        .tab { padding: 12px 24px; background: #16213e; border: none; border-radius: 8px 8px 0 0; 
               color: #aaa; cursor: pointer; font-size: 16px; }
        .tab.active { background: #e94560; color: #fff; }
        .tab:hover:not(.active) { background: #0f3460; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section h2 { margin-bottom: 15px; color: #ff6b6b; font-size: 18px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin-bottom: 15px; border: none; border-radius: 4px; 
                       background: #0f3460; color: #eee; font-size: 14px; }
        input[type="checkbox"] { width: auto; margin-right: 10px; }
        button { background: #e94560; color: white; border: none; padding: 12px 24px; border-radius: 4px; 
                 cursor: pointer; font-size: 14px; margin-right: 10px; }
        button:hover { background: #ff6b6b; }
        button.secondary { background: #0f3460; }
        .slider-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .slider-row input[type="number"], .slider-row input[type="text"] { margin-bottom: 0; }
        .remove-btn { background: #e94560; padding: 10px; width: auto; }
        .volume-row { display: flex; align-items: center; gap: 15px; padding: 10px; background: #0f3460; border-radius: 4px; margin-bottom: 10px; }
        .volume-row .percent { font-weight: bold; color: #e94560; min-width: 50px; text-align: right; }
        .volume-bar { flex: 1; height: 20px; background: #1a1a2e; border-radius: 10px; overflow: hidden; }
        .volume-fill { height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b); border-radius: 10px; transition: width 0.1s; }
        .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .overview-card { background: #0f3460; padding: 20px; border-radius: 8px; }
        .overview-card h3 { color: #ff6b6b; margin-bottom: 10px; }
        .overview-card .value { font-size: 24px; font-weight: bold; }
        .app-item { display: inline-block; padding: 8px 16px; margin: 5px; border-radius: 4px; cursor: pointer; background: #0f3460; }
        .app-item.active { background: #28a745; }
        .app-item:hover { background: #e94560; }
        .popup { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
        .popup-content { background: #16213e; padding: 30px; border-radius: 8px; max-width: 400px; width: 100%; }
        .popup-content h2 { margin-bottom: 10px; }
        .popup-content p { margin-bottom: 20px; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deej Config Editor</h1>
        
        <div class="tabs">
            <button id="tab-home" class="tab active" onclick="showTab('home')">Home</button>
            <button id="tab-sliders" class="tab" onclick="showTab('sliders')">Slider Settings</button>
            <button id="tab-apps" class="tab" onclick="showTab('apps')">App Configuration</button>
        </div>
        
        <div id="home" class="tab-content active">
            <div class="section">
                <h2>Live Volumes</h2>
                <div id="live_volumes"></div>
            </div>
            <div class="section">
                <h2>Overview</h2>
                <div class="overview-grid">
                    <div class="overview-card">
                        <h3>COM Port</h3>
                        <div class="value" id="overview_port">-</div>
                    </div>
                    <div class="overview-card">
                        <h3>Baud Rate</h3>
                        <div class="value" id="overview_baud">-</div>
                    </div>
                    <div class="overview-card">
                        <h3>Sliders</h3>
                        <div class="value" id="overview_sliders">-</div>
                    </div>
                    <div class="overview-card">
                        <h3>Status</h3>
                        <div class="value" id="overview_status">Connected</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="sliders" class="tab-content">
            <div class="section">
                <h2>Serial Settings</h2>
                <label>COM Port</label>
                <select id="com_port"></select>
                <label>Baud Rate</label>
                <input type="number" id="baud_rate" value="9600">
            </div>
            <div class="section">
                <h2>Slider Mapping</h2>
                <div id="mappings"></div>
                <button onclick="addMapping()">Add Slider</button>
            </div>
            <div class="section">
                <h2>Options</h2>
                <label>Jitter Threshold</label>
                <input type="number" id="jitter_threshold" value="10">
                <label>
                    <input type="checkbox" id="invert_sliders"> Invert Sliders
                </label>
                <label>
                    <input type="checkbox" id="reconnect" checked> Auto Reconnect
                </label>
            </div>
            <button onclick="save()">Save Config</button>
            <button class="secondary" onclick="load()">Reload</button>
        </div>
        
        <div id="apps" class="tab-content">
            <div class="section">
                <h2>Application List</h2>
                <p style="color: #888; margin-bottom: 15px;">Green = currently active. Click to bind to slider.</p>
                <div id="app_list"></div>
                <button class="secondary" onclick="refreshApps()">Refresh</button>
            </div>
        </div>
        
        <div id="popup" class="popup" style="display: none;">
            <div class="popup-content">
                <h2>Bind App to Slider</h2>
                <p id="popup_app_name"></p>
                <div id="slider_select"></div>
                <button onclick="bindToSlider()">Save</button>
                <button class="secondary" onclick="closePopup()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/eel.js"></script>
    <script>
        let config = {};
        
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        
        async function load() {
            config = await eel.load_config()();
            document.getElementById('com_port').value = config.com_port || 'COM3';
            document.getElementById('baud_rate').value = config.baud_rate || 9600;
            document.getElementById('jitter_threshold').value = config.jitter_threshold || 10;
            document.getElementById('invert_sliders').checked = config.invert_sliders || false;
            document.getElementById('reconnect').checked = config.reconnect !== false;
            
            const ports = await eel.get_com_ports()();
            const portSelect = document.getElementById('com_port');
            portSelect.innerHTML = ports.map(p => `<option value="${p}">${p}</option>`).join('');
            portSelect.value = config.com_port || 'COM3';
            
            document.getElementById('overview_port').textContent = config.com_port || 'COM3';
            document.getElementById('overview_baud').textContent = config.baud_rate || 9600;
            
            const mapping = config.slider_mapping || {};
            document.getElementById('overview_sliders').textContent = Object.keys(mapping).length;
            
            const mappings = document.getElementById('mappings');
            mappings.innerHTML = '';
            for (const [slider, apps] of Object.entries(mapping)) {
                addMapping(slider, Array.isArray(apps) ? apps.join(', ') : apps);
            }
            
            // Load saved app list
            const savedApps = await eel.load_app_list()();
            savedApps.forEach(a => allAppsSet.add(a));
            
            // Refresh apps
            refreshApps();
        }
        
        function addMapping(sliderVal = '', appsVal = '') {
            const div = document.createElement('div');
            div.className = 'slider-row';
            div.innerHTML = `
                <input type="number" placeholder="Slider #" value="${sliderVal}" class="slider-num">
                <input type="text" placeholder="App names (comma separated)" value="${appsVal}" class="app-names">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            document.getElementById('mappings').appendChild(div);
        }
        
        async function save() {
            const mapping = {};
            document.querySelectorAll('#mappings .slider-row').forEach(row => {
                const slider = row.querySelector('.slider-num').value;
                const apps = row.querySelector('.app-names').value;
                if (slider && apps) {
                    mapping[slider] = apps.split(',').map(a => a.trim()).filter(a => a);
                }
            });
            
            config = {
                slider_mapping: mapping,
                com_port: document.getElementById('com_port').value,
                baud_rate: parseInt(document.getElementById('baud_rate').value),
                jitter_threshold: parseInt(document.getElementById('jitter_threshold').value),
                invert_sliders: document.getElementById('invert_sliders').checked,
                reconnect: document.getElementById('reconnect').checked
            };
            
            await eel.save_config(config)();
            alert('Config saved!');
        }
        
        let allAppsSet = new Set();
        let selectedApp = null;
        
        async function refreshApps() {
            const activeApps = await eel.get_active_apps()();
            const activeSet = new Set(activeApps);
            
            // Get apps from mapping
            const mapping = config.slider_mapping || {};
            for (const apps of Object.values(mapping)) {
                if (Array.isArray(apps)) apps.forEach(a => allAppsSet.add(a));
                else if (apps) allAppsSet.add(apps);
            }
            activeApps.forEach(a => allAppsSet.add(a));
            
            // Save to persistent list
            await eel.save_app_list(Array.from(allAppsSet));
            
            // Render
            renderAppList(activeSet);
        }
        
        function renderAppList(activeSet) {
            const container = document.getElementById('app_list');
            container.innerHTML = Array.from(allAppsSet).map(app => {
                const isActive = activeSet.has(app);
                return `<span class="app-item ${isActive ? 'active' : ''}" onclick="showBindPopup('${app}')">${app}</span>`;
            }).join('');
        }
        
        function showBindPopup(app) {
            selectedApp = app;
            document.getElementById('popup_app_name').textContent = app;
            document.getElementById('popup').style.display = 'flex';
            
            // Build slider options from current mapping
            const mapping = config.slider_mapping || {};
            const mappingList = Array.from(new Set(Object.values(mapping).flat()));
            
            let html = '';
            for (let i = 0; i <= 4; i++) {
                const apps = mapping[String(i)] || [];
                const isBound = Array.isArray(apps) ? apps.includes(app) : apps === app;
                html += `<label style="display: flex; align-items: center; margin-bottom: 10px;">
                    <input type="checkbox" name="slider_bind" value="${i}" ${isBound ? 'checked' : ''}>
                    <span>Slider ${i}</span>
                </label>`;
            }
            document.getElementById('slider_select').innerHTML = html;
        }
        
        function bindToSlider() {
            const mapping = config.slider_mapping || {};
            const checkboxes = document.querySelectorAll('input[name="slider_bind"]:checked');
            const sliders = Array.from(checkboxes).map(c => c.value);
            
            // Remove app from all sliders first
            for (const key of Object.keys(mapping)) {
                let apps = mapping[key];
                if (Array.isArray(apps)) {
                    mapping[key] = apps.filter(a => a !== selectedApp);
                    if (mapping[key].length === 0) delete mapping[key];
                } else if (apps === selectedApp) {
                    delete mapping[key];
                }
            }
            
            // Add to selected sliders
            for (const slider of sliders) {
                if (mapping[slider]) {
                    if (Array.isArray(mapping[slider])) {
                        if (!mapping[slider].includes(selectedApp)) {
                            mapping[slider].push(selectedApp);
                        }
                    } else {
                        mapping[slider] = [mapping[slider], selectedApp];
                    }
                } else {
                    mapping[slider] = selectedApp;
                }
            }
            
            config.slider_mapping = mapping;
            document.getElementById('popup').style.display = 'none';
            updateMappingsUI();
        }
        
        function updateMappingsUI() {
            const container = document.getElementById('mappings');
            container.innerHTML = '';
            const mapping = config.slider_mapping || {};
            for (const [slider, apps] of Object.entries(mapping)) {
                addMapping(slider, Array.isArray(apps) ? apps.join(', ') : apps);
            }
        }
        
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }
        
        async function updateVolumes() {
            const vols = await eel.get_volume_state()();
            const container = document.getElementById('live_volumes');
            if (Object.keys(vols).length === 0) {
                container.innerHTML = '<p style="color: #888;">No slider activity</p>';
            } else {
                container.innerHTML = Object.entries(vols).map(([slider, data]) => {
                    const apps = Array.isArray(data.apps) ? data.apps.join(', ') : data.apps;
                    return `<div class="volume-row">
                        <span>Slider ${slider}</span>
                        <span>${apps}</span>
                        <span class="percent">${data.percent}%</span>
                        <div class="volume-bar"><div class="volume-fill" style="width: ${data.percent}%"></div></div>
                    </div>`;
                }).join('');
            }
        }
        
        load();
        setInterval(updateVolumes, 100);
    </script>
</body>
</html>
