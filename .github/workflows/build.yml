name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: deej.exe
            ext: .exe
          - os: ubuntu-latest
            artifact: deej
            ext: ''
          - os: macos-latest
            artifact: deej.app
            ext: .app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Rename macOS artifact
        if: matrix.os == 'macos-latest'
        run: mv dist/deej dist/deej.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deej-${{ matrix.os }}
          path: dist/*${{ matrix.ext }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}